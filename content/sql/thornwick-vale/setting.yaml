id: thornwick-vale
language: sql
name: Thornwick Vale
tagline: Adventurers, quests and monsters of a small frontier valley.
description: >
  The guild ledger of Thornwick Vale and its neighbouring towns: the adventurers who
  take its quests, the parties they form, the spells they know, the treasure they carry
  and the monsters they face.
